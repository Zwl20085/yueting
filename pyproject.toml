[project]
name = "yueting"
version = "0.1.0"
description = "悦听 — 中文向终端音乐播放器 (TUI music player for Chinese users, YouTube/Bilibili sources)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Zwl20085" }]
keywords = ["music", "tui", "player", "bilibili", "youtube", "chinese"]
dependencies = [
    "textual>=1.0",
    "yt-dlp>=2025.1.1",
]

[project.scripts]
yueting = "yueting.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yueting"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.coverage.run]
source = ["src/yueting"]
omit = ["src/yueting/ui/*", "src/yueting/__main__.py"]
